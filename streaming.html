<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch & listen · No Consolation</title>
  <meta name="description" content="Watch No Consolation live on Twitch, catch highlights on YouTube and listen to the podcast.">
  <meta name="theme-color" content="#120B2A">
  <link rel="icon" href="images/favicon.png">
  <meta property="og:title" content="Watch & listen · No Consolation">
  <meta property="og:description" content="Watch No Consolation live on Twitch, catch highlights on YouTube and listen to the podcast.">
  <meta property="og:image" content="https://noconsolation.github.io/images/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">

  <script src="config.js" defer></script>
  <script src="assets/js/core.js" defer></script>
  <script src="assets/js/pages/watch.js" defer></script>
</head>
<body data-page="watch">
  <header id="site-header" class="site-header"></header>
  <main id="main">
    <div class="wrap">
      <div class="page-head">
        <h1>Watch &amp; listen</h1>
        <p class="lede">Matches stream live on Twitch. Highlights land on YouTube, and the podcast covers the rest.</p>
      </div>
      <section>
        <h2>Live on Twitch</h2>
        <div id="twitch" class="embed"></div>
        <div class="row" style="margin-top:1rem">
          <a class="btn btn--red" href="https://twitch.tv/noconsolation" target="_blank" rel="noopener"><span>Open Twitch</span></a>
          <a id="suggest" class="btn btn--ghost" href="#" target="_blank" rel="noopener"><span>Suggest something for the stream</span></a>
        </div>
      </section>
      <section class="section grid grid--2" style="padding-inline:0">
        <div><h2>Latest uploads</h2><div class="embed"><button id="latest" class="facade"><span>Play latest uploads</span></button></div></div>
        <div><h2>Highlights playlist</h2><div class="embed"><button id="playlist" class="facade"><span>Play highlights</span></button></div></div>
      </section>
      <section>
        <h2>Podcast</h2>
        <div id="podcast"></div>
      </section>
    </div>
  </main>
</body>
