<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Past season · No Consolation</title>
  <meta name="description" content="Standings, bracket and schedule from a past Strikers Premier League season.">
  <meta name="theme-color" content="#120B2A">
  <link rel="icon" href="images/favicon.png">
  <meta property="og:title" content="Past season · No Consolation">
  <meta property="og:description" content="Standings, bracket and schedule from a past Strikers Premier League season.">
  <meta property="og:image" content="https://noconsolation.github.io/images/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://docs.google.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="config.js" defer></script>
  <script src="assets/js/core.js" defer></script>
  <script src="assets/js/pages/league.js" defer></script>
</head>
<body data-page="season" data-section="league">
  <header id="site-header" class="site-header"></header>
  <main id="main">
    <div class="wrap">
      <div class="page-head row row--between">
        <h1 id="season-title" style="margin:0">Standings</h1>
        <div id="tools"></div>
      </div>
      <div id="standings" class="grid grid--3"><div class="skeleton"></div></div>
      <div id="legend" class="legend"></div>
      <div id="extra-links" class="row" style="margin-top:1rem"></div>
    </div>

    <section id="bracket" class="section wrap" hidden></section>

    <section class="section">
      <div class="wrap">
        <div class="row row--between" style="margin-bottom:.75rem">
          <h2 style="margin:0">Schedule</h2>
          <div id="league-filters" class="chips" role="group" aria-label="Filter by league"></div>
        </div>
        <div id="schedule"><div class="skeleton"></div></div>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <h2>Coaches</h2>
        <div id="coaches"><div class="skeleton"></div></div>
      </div>
    </section>
  </main>
</body>
</html>
